[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "textgate"
version = "0.1.0"
description = "Check what a language model wrote against word rules, and measure how often it passes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "leekwangeun" }]
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
textgate = "textgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/textgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# curly quotes are among the characters norm() strips
allowed-confusables = ["‘", "’", "“", "”"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
# a field name the model does not have is a type error, as it is at run time
init_forbid_extra = true
